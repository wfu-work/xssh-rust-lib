[package]
name = "xssh-rust-lib"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Pure Rust SSH core, terminal, and SFTP library"
repository = "https://github.com/wfu-work/xssh-rust-lib"
readme = "README.md"
keywords = ["ssh", "rust", "terminal", "sftp"]
categories = ["network-programming", "authentication", "filesystem"]

[dependencies]
russh = { version = "=0.54.3", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
zeroize = "1.8.1"
russh-sftp = { version = "=2.1.0", optional = true }

[features]
default = ["terminal", "sftp"]
terminal = []
sftp = ["dep:russh-sftp"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
